route:
  receiver: mongo
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    # The medic first (docker#143): an alert with a `remedy` label gets one allowlisted fix
    # before anyone is paged. If it gives up, it forwards the alert to Mongo itself.
    - matchers: ['remedy=~".+"']
      receiver: medic
      repeat_interval: 1h
    - matchers: [severity="critical"]
      receiver: mongo
      repeat_interval: 1h

# A critical alert silences its own warning (same alert, same disk/host).
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, instance, mountpoint]
  # pve01 off = its k3s VMs off: one page, not four (docker#115). A k3s node that
  # drops while pve01 is up still pages.
  - source_matchers: [alertname="TargetDown", instance="pve01"]
    target_matchers: [alertname="TargetDown", 'instance=~"k3s0[1-3]"']   # quoted: [ ] inside a flow list

receivers:
  # Mongo's bridge (agent-bus #134/#135, thread 018): takes the standard webhook v4 JSON
  # and posts as @mongo in #infra, formatting included. No secret needed here
  # (docker#96: the old slack_configs pointed at a webhook file that never existed).
  - name: mongo
    webhook_configs:
      - url: http://agentbus_mongo:9095/alert
        send_resolved: true

  # Rusty the medic (docker#143): systemd/medic.service on the host, bound to docker0 only.
  - name: medic
    webhook_configs:
      - url: http://dockerhost:9097/alert
        send_resolved: true
