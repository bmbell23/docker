# Probe modules for blackbox_exporter (docker#121).
modules:
  # Up/down check, not a cert check: Rancher serves a self-signed cert, and
  # an expired or untrusted cert shouldn't page anyone as "ingress down".
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      tls_config:
        insecure_skip_verify: true
