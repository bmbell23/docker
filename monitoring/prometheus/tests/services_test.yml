# promtool unit tests for monitoring/rules/services.yml. See README.md for the command.
rule_files:
  - ../rules/services.yml

evaluation_interval: 30s

tests:
  # 4 Oct 2026: Romm down, everything else up.
  - name: a card down for 5m fires ServiceDown with its name and owner
    interval: 30s
    input_series:
      - series: 'dashboard_card_up{job="dashboard-cards",key="romm",name="Romm",owner="dakota",url="http://100.69.184.113:8080"}'
        values: '0x20'
      - series: 'dashboard_card_up{job="dashboard-cards",key="jellyfin",name="Jellyfin",owner="dakota",url="http://100.69.184.113:8096"}'
        values: '1x20'
      - series: 'up{job="dashboard-cards"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              remedy: recreate
              job: dashboard-cards
              key: romm
              name: Romm
              owner: dakota
              url: http://100.69.184.113:8080
            exp_annotations:
              summary: "Romm is down: http://100.69.184.113:8080 does not answer (owner: dakota)"

  - name: a one-probe blip does not fire
    interval: 30s
    input_series:
      - series: 'dashboard_card_up{job="dashboard-cards",key="romm",name="Romm",owner="dakota",url="http://100.69.184.113:8080"}'
        values: '1 1 0 0 1x16'
    alert_rule_test:
      - eval_time: 10m
        alertname: ServiceDown
        exp_alerts: []

  - name: no Dashboard scrape fires DashboardProbesDown
    interval: 30s
    input_series:
      - series: 'up{job="dashboard-cards"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: DashboardProbesDown
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: daisy
              job: dashboard-cards
            exp_annotations:
              summary: "Prometheus cannot scrape the Dashboard (:8001/metrics); service-down alerts are blind"

  - name: frozen probe timestamps fire CardProbesStale
    interval: 1m
    input_series:
      - series: 'dashboard_card_probe_timestamp_seconds{key="romm"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: CardProbesStale
        exp_alerts: []
      - eval_time: 20m
        alertname: CardProbesStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The Dashboard has not probed the service cards for 20m 0s"

  # docker#143: only cards with a medic target get `remedy`; the rest page Mongo directly.
  - name: a card without a medic target fires ServiceDown with no remedy label
    interval: 30s
    input_series:
      - series: 'dashboard_card_up{job="dashboard-cards",key="immich",name="Immich",owner="dakota",url="http://100.69.184.113:2283"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: dashboard-cards
              key: immich
              name: Immich
              owner: dakota
              url: http://100.69.184.113:2283
            exp_annotations:
              summary: "Immich is down: http://100.69.184.113:2283 does not answer (owner: dakota)"

  # docker#160: the agents' own apps are on the list too.
  - name: a down agent app card gets the recreate remedy
    interval: 30s
    input_series:
      - series: 'dashboard_card_up{job="dashboard-cards",key="artforge",name="ArtForge",owner="aria",url="http://100.69.184.113:8003"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              remedy: recreate
              job: dashboard-cards
              key: artforge
              name: ArtForge
              owner: aria
              url: http://100.69.184.113:8003
            exp_annotations:
              summary: "ArtForge is down: http://100.69.184.113:8003 does not answer (owner: aria)"

  - name: the medic not answering fires MedicDown, with no remedy label
    interval: 30s
    input_series:
      - series: 'up{job="medic",instance="dockerhost"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: MedicDown
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: dakota
              job: medic
              instance: dockerhost
            exp_annotations:
              summary: "The medic (systemd/medic.service, :9097) is not answering; remedy alerts reach nobody until it's back"

  # docker#161: the remedy label chains playbooks with `+`; the medic drops the empty parts.
  - name: chained remedies per card
    interval: 30s
    input_series:
      - series: 'dashboard_card_up{job="dashboard-cards",key="jellyfin",name="Jellyfin",owner="dakota",url="u"}'
        values: '0x20'
      - series: 'dashboard_card_up{job="dashboard-cards",key="immich",name="Immich",owner="dakota",url="u"}'
        values: '0x20'
      - series: 'dashboard_card_up{job="dashboard-cards",key="greatreads-prod",name="GreatReads",owner="ginger",url="u"}'
        values: '0x20'
      - series: 'dashboard_card_up{job="dashboard-cards",key="romm",name="Romm",owner="dakota",url="u"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels: {severity: critical, remedy: recreate+dnat, job: dashboard-cards, key: jellyfin, name: Jellyfin, owner: dakota, url: u}
            exp_annotations: {summary: "Jellyfin is down: u does not answer (owner: dakota)"}
          - exp_labels: {severity: critical, remedy: +dnat, job: dashboard-cards, key: immich, name: Immich, owner: dakota, url: u}
            exp_annotations: {summary: "Immich is down: u does not answer (owner: dakota)"}
          - exp_labels: {severity: critical, remedy: user-unit, job: dashboard-cards, key: greatreads-prod, name: GreatReads, owner: ginger, url: u}
            exp_annotations: {summary: "GreatReads is down: u does not answer (owner: ginger)"}
          - exp_labels: {severity: critical, remedy: recreate, job: dashboard-cards, key: romm, name: Romm, owner: dakota, url: u}
            exp_annotations: {summary: "Romm is down: u does not answer (owner: dakota)"}
