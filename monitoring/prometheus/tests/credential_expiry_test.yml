# The registry entry (2027) must stay quiet; a credential 20 days out warns, 3 days out is critical.
rule_files: [../rules/credential-expiry.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'credential_expiry_timestamp_seconds{credential="soon",used_by="x",vault="v",owner="peter"}'
        values: '1728000x10'
      - series: 'credential_expiry_timestamp_seconds{credential="very soon",used_by="y",vault="w",owner="paul"}'
        values: '259200x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: CredentialExpiringSoon
        exp_alerts:
          - exp_labels: {severity: warning, credential: soon, used_by: x, vault: v, owner: peter}
            exp_annotations: {summary: "soon expires in 19d 23h 59m 0s (used by x; renew, then update v)"}
      - eval_time: 1m
        alertname: CredentialExpiringCritical
        exp_alerts:
          - exp_labels: {severity: critical, credential: very soon, used_by: y, vault: w, owner: paul}
            exp_annotations: {summary: "very soon expires in 2d 23h 59m 0s or has expired (used by y)"}
