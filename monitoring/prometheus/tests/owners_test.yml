# Who Mongo pages for a host-level critical alert (agent-bus#179): the owner label template.
rule_files: [../rules/host.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="proxmox"}'
        values: '0x10'
      - series: 'up{job="node",instance="pve01"}'
        values: '0x10'
      - series: 'up{job="node",instance="k3s02"}'
        values: '0x10'
      - series: 'up{job="node",instance="dockerhost"}'
        values: '0x10'
      - series: 'up{job="dashboard-cards",instance="dockerhost:8001"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: critical, owner: paul, job: node, instance: proxmox}
            exp_annotations: {summary: "node on proxmox has been unreachable for 5m"}
          - exp_labels: {severity: critical, owner: peter, job: node, instance: pve01}
            exp_annotations: {summary: "node on pve01 has been unreachable for 5m"}
          - exp_labels: {severity: critical, owner: peter, job: node, instance: k3s02}
            exp_annotations: {summary: "node on k3s02 has been unreachable for 5m"}
          - exp_labels: {severity: critical, owner: dakota, job: node, instance: dockerhost}
            exp_annotations: {summary: "node on dockerhost has been unreachable for 5m"}
          - exp_labels: {severity: critical, owner: daisy, job: dashboard-cards, instance: "dockerhost:8001"}
            exp_annotations: {summary: "dashboard-cards on dockerhost:8001 has been unreachable for 5m"}
