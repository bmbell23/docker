# Credential expiry registry (agent-bus thread: Peter, 2026-10-04). Names and dates only, never
# the secret. One recording rule per credential; the alerts below cover them all.
# To add one: copy a block, set the epoch (`date -ud 2027-10-04 +%s`), credential, used_by, owner.
groups:
  - name: credential-expiry-registry
    # Default interval on purpose: a recorded sample is only visible for 5 min (lookback),
    # so an `interval: 1h` group would leave the alerts blind ~55 min of every hour.
    rules:
      - record: credential_expiry_timestamp_seconds
        expr: vector(1822608000)   # 2027-10-04 00:00 UTC
        labels:
          credential: k3s ghcr pull token
          kind: GitHub classic PAT (read:packages)
          used_by: k3s01-03 /etc/rancher/k3s/registries.yaml
          vault: "Vaultwarden: k3s ghcr pull token (k3s01–03)"
          owner: peter

  - name: credential-expiry
    rules:
      - alert: CredentialExpiringSoon
        expr: ((credential_expiry_timestamp_seconds - time()) < 28 * 86400) >= 7 * 86400
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.credential }} expires in {{ $value | humanizeDuration }} (used by {{ $labels.used_by }}; renew, then update {{ $labels.vault }})"
      - alert: CredentialExpiringCritical
        expr: (credential_expiry_timestamp_seconds - time()) < 7 * 86400
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.credential }} expires in {{ $value | humanizeDuration }} or has expired (used by {{ $labels.used_by }})"
