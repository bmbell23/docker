# Starter rules (#53). Daisy owns the thresholds from here on.
# The bar: Mongo only speaks when something is actually in danger.
groups:
  - name: host
    rules:
      - alert: HostDiskUsage
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
             / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full"

      - alert: HostDiskUsage
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
             / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}) > 0.95
        for: 5m
        labels:
          severity: critical
          owner: '{{ if eq $labels.instance "proxmox" }}paul{{ else if or (eq $labels.instance "pve01") (match "^k3s" $labels.instance) }}peter{{ else if eq $labels.job "dashboard-cards" }}daisy{{ else }}dakota{{ end }}'
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full"

      # Jan 7 was a disk filling up. Catch the trend before the threshold.
      - alert: HostDiskFillingFast
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}[6h], 24 * 3600) < 0
          and on (instance, mountpoint)
          (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) > 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} will be full within 24h at the current rate"

      # Niced work (Jellyfin thumbnails, whisper) yields to everything else, so it
      # doesn't count as busy here. Sum the not-busy modes, then divide by the CPU count
      # (docker#88: avg over modes x CPUs divided the not-busy share by 3).
      - alert: HostCPUSaturated
        expr: |
          1 - sum by (instance) (rate(node_cpu_seconds_total{mode=~"idle|nice|iowait"}[5m]))
            / count by (instance) (node_cpu_seconds_total{mode="idle"}) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} CPU is {{ $value | humanizePercentage }} busy (excluding niced work) for 15m"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has {{ $value | humanizePercentage }} memory available"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 5m
        labels:
          severity: critical
          owner: '{{ if eq $labels.instance "proxmox" }}paul{{ else if or (eq $labels.instance "pve01") (match "^k3s" $labels.instance) }}peter{{ else if eq $labels.job "dashboard-cards" }}daisy{{ else }}dakota{{ end }}'
        annotations:
          summary: "{{ $labels.instance }} has {{ $value | humanizePercentage }} memory available"

  - name: targets
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          owner: '{{ if eq $labels.instance "proxmox" }}paul{{ else if or (eq $labels.instance "pve01") (match "^k3s" $labels.instance) }}peter{{ else if eq $labels.job "dashboard-cards" }}daisy{{ else }}dakota{{ end }}'
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for 5m"

  # The Proxmox host's drives (docker#92). smartctl_exporter only lists drives that
  # answer, so a drive that dies outright vanishes rather than reporting 0: count them.
  - name: smart
    rules:
      - alert: DriveSmartFailing
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels:
          severity: critical
          owner: paul
        annotations:
          summary: "{{ $labels.instance }} drive {{ $labels.device }} fails its SMART health check"

      - alert: DriveMissing
        expr: count by (instance) (smartctl_device_smart_status{instance="proxmox"}) < 5
        for: 30m
        labels:
          severity: critical
          owner: paul
        annotations:
          summary: "{{ $labels.instance }} reports only {{ $value }} of 5 drives to SMART; one stopped answering"

  - name: containers
    rules:
      - alert: ContainerRestartLoop
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted {{ $value }} times in 15m"

  # Dagu only speaks when a run fails; a run that never happens (suspended, never
  # scheduled) says nothing. peter-restic stamps each success into pve01's
  # node-exporter textfile dir (proxmox#60, docker#117). While pve01 is down the
  # metric is absent, not stale: TargetDown{instance="pve01"} covers that.
  - name: backups
    rules:
      - alert: BackupStale
        expr: time() - restic_backup_last_success_timestamp_seconds > 30 * 3600
        for: 15m
        labels:
          severity: critical
          owner: peter
        annotations:
          summary: "{{ $labels.instance }} restic {{ $labels.repo }}: no good backup for {{ $value | humanizeDuration }}"

      - alert: RestoreTestStale
        expr: time() - restic_restore_test_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} restic {{ $labels.repo }}: no passing restore test for {{ $value | humanizeDuration }}"
