# k3s cluster (docker#121, rules drafted by Daisy 2026-10-04).
# Node *unreachable* is already TargetDown{instance=~"k3s0[1-3]"}.
# K3sNodeNotReady / K3sNodeMetricsMissing / VMStopped land with their feeds
# (kube-state-metrics, pve exporter): the absent() rule would page on install.
groups:
  - name: k3s
    rules:
      # job="k3s-ingress": blackbox_exporter, one target per *.10.0.0.201.sslip.io URL.
      - alert: K3sIngressDown
        expr: probe_success{job="k3s-ingress"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has not answered for 5m"
