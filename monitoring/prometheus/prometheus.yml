global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: dockerhost

  # One target per machine, by LAN IP, labelled with its hostname.
  - job_name: node
    static_configs:
      - targets: ['dockerhost:9100']
        labels:
          instance: dockerhost
      # Proxmox host (docker#92, proxmox#42), by LAN IP like the Dagu ssh config.
      - targets: ['10.0.0.159:9100']
        labels:
          instance: proxmox
      # pve01, the backup server, and its k3s VMs (docker#98, thread 018).
      - targets: ['10.0.0.197:9100']
        labels:
          instance: pve01
      - targets: ['10.0.0.201:9100']
        labels:
          instance: k3s01
      - targets: ['10.0.0.202:9100']
        labels:
          instance: k3s02
      - targets: ['10.0.0.203:9100']
        labels:
          instance: k3s03

  # SMART for the Proxmox host's drives (docker#92, proxmox#42). 5 report today:
  # nvme0, sda (boston), sdb, sdd (external), sde (allston). sdc died in May.
  - job_name: smartctl
    scrape_interval: 60s
    static_configs:
      - targets: ['10.0.0.159:9633']
        labels:
          instance: proxmox

  # k3s ingress, probed through blackbox_exporter (docker#121). The *.sslip.io
  # names resolve to k3s01, so this also goes red when k3s01 is down.
  - job_name: k3s-ingress
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://dictionary.10.0.0.201.sslip.io
          - http://argocd.10.0.0.201.sslip.io
          - https://rancher.10.0.0.201.sslip.io
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # k3s node readiness (docker#123, proxmox#66). A NodePort, so any node answers.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ['10.0.0.201:30808']
        labels:
          instance: k3s

  # pve01's VMs through prometheus-pve-exporter (docker#123): read-only PVEAuditor token.
  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
    static_configs:
      - targets: ['10.0.0.197']
        labels:
          instance: pve01
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: pve-exporter:9221

  # dockerhost's services, probed at the address people open (docker#127). Catches what
  # cAdvisor can't: a crash loop (it keeps the first start time through in-place restarts)
  # and a container that's up but unreachable (Jackett pinned to a dead VPN namespace).
  # New service: one line here, named like its Dashboard card.
  - job_name: services
    metrics_path: /probe
    params:
      module: [http_up]
    static_configs:
      - {targets: ['http://100.69.184.113:8001/'], labels: {service: dashboard}}
      - {targets: ['http://100.69.184.113:8002/'], labels: {service: wordforge}}
      - {targets: ['http://100.69.184.113:8003/'], labels: {service: artforge}}
      - {targets: ['http://100.69.184.113:8004/'], labels: {service: lifeforge}}
      - {targets: ['http://100.69.184.113:8005/'], labels: {service: museforge-studio}}
      - {targets: ['http://100.69.184.113:8006/'], labels: {service: funforge}}
      - {targets: ['http://100.69.184.113:8008/'], labels: {service: pokevault}}
      - {targets: ['http://100.69.184.113:8009/'], labels: {service: mealforge}}
      - {targets: ['http://100.69.184.113:8010/'], labels: {service: nerdnews}}
      - {targets: ['http://100.69.184.113:8011/'], labels: {service: chess}}
      - {targets: ['http://100.69.184.113:8012/'], labels: {service: webforge-releases}}
      - {targets: ['http://100.69.184.113:8013/'], labels: {service: webforge-sync}}
      - {targets: ['http://100.69.184.113:8014/'], labels: {service: dagu}}
      - {targets: ['http://100.69.184.113:8015/'], labels: {service: mattermost}}
      - {targets: ['http://100.69.184.113:8016/'], labels: {service: grafana}}
      - {targets: ['http://100.69.184.113:8090/'], labels: {service: greatreads}}
      - {targets: ['http://100.69.184.113:8092/'], labels: {service: greatreads-reader}}
      - {targets: ['http://100.69.184.113:5007/'], labels: {service: libby}}
      - {targets: ['http://100.69.184.113:8080/'], labels: {service: romm}}
      - {targets: ['http://100.69.184.113:9117/'], labels: {service: jackett}}
      - {targets: ['http://100.69.184.113:2285/'], labels: {service: qbittorrent}}
      - {targets: ['http://100.69.184.113:8096/'], labels: {service: jellyfin}}
      - {targets: ['http://100.69.184.113:13378/'], labels: {service: audiobookshelf}}
      # immich (:2283) waits on docker#128: containers can't reach it, so it would page on install.
      - {targets: ['http://100.69.184.113:8083/'], labels: {service: calibre}}
      - {targets: ['http://100.69.184.113:8084/'], labels: {service: calibre-web}}
      - {targets: ['http://100.69.184.113:8222/'], labels: {service: vaultwarden}}
      - {targets: ['http://100.69.184.113:8053/'], labels: {service: pihole}}
      - {targets: ['http://100.69.184.113:6595/'], labels: {service: deemix}}
      - {targets: ['http://100.69.184.113:8998/'], labels: {service: youtube-downloader}}
      - {targets: ['http://100.69.184.113:9999/'], labels: {service: stash}}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
