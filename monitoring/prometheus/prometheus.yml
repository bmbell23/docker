global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: dockerhost

  # One target per machine, by LAN IP, labelled with its hostname.
  - job_name: node
    static_configs:
      - targets: ['dockerhost:9100']
        labels:
          instance: dockerhost
      # Proxmox host (docker#92, proxmox#42), by LAN IP like the Dagu ssh config.
      - targets: ['10.0.0.159:9100']
        labels:
          instance: proxmox
      # pve01, the backup server, and its k3s VMs (docker#98, thread 018).
      - targets: ['10.0.0.197:9100']
        labels:
          instance: pve01
      - targets: ['10.0.0.201:9100']
        labels:
          instance: k3s01
      - targets: ['10.0.0.202:9100']
        labels:
          instance: k3s02
      - targets: ['10.0.0.203:9100']
        labels:
          instance: k3s03

  # SMART for the Proxmox host's drives (docker#92, proxmox#42). 5 report today:
  # nvme0, sda (boston), sdb, sdd (external), sde (allston). sdc died in May.
  - job_name: smartctl
    scrape_interval: 60s
    static_configs:
      - targets: ['10.0.0.159:9633']
        labels:
          instance: proxmox

  # k3s ingress, probed through blackbox_exporter (docker#121). The *.sslip.io
  # names resolve to k3s01, so this also goes red when k3s01 is down.
  - job_name: k3s-ingress
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://dictionary.10.0.0.201.sslip.io
          - http://argocd.10.0.0.201.sslip.io
          - https://rancher.10.0.0.201.sslip.io
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # k3s node readiness (docker#123, proxmox#66). A NodePort, so any node answers.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ['10.0.0.201:30808']
        labels:
          instance: k3s

  # pve01's VMs through prometheus-pve-exporter (docker#123): read-only PVEAuditor token.
  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
    static_configs:
      - targets: ['10.0.0.197']
        labels:
          instance: pve01
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: pve-exporter:9221

  # Rusty the medic (docker#143): if he's down, remedy alerts reach nobody. MedicDown pages.
  - job_name: medic
    static_configs:
      - targets: ['dockerhost:9097']
        labels:
          instance: dockerhost

  # dockerhost's services (docker#127): the Dashboard probes every card URL in its
  # services.json every 60s at the address people open, and exports dashboard_card_up
  # with name/url/owner (Dashboard#66). A new card is watched the moment it's added.
  # Rules: rules/services.yml (ServiceDown, CardProbesStale, DashboardProbesDown).
  - job_name: dashboard-cards
    scrape_interval: 60s
    static_configs:
      - targets: ['dockerhost:8001']
        labels:
          instance: dockerhost
