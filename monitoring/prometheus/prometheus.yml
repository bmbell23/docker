global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: dockerhost

  # One target per machine, by LAN IP, labelled with its hostname.
  - job_name: node
    static_configs:
      - targets: ['dockerhost:9100']
        labels:
          instance: dockerhost
      # Proxmox host (docker#92, proxmox#42), by LAN IP like the Dagu ssh config.
      - targets: ['10.0.0.159:9100']
        labels:
          instance: proxmox
      # pve01, the backup server, and its k3s VMs (docker#98, thread 018). `parent` lets
      # pve01's own TargetDown mute theirs while the whole box is off (docker#115).
      - targets: ['10.0.0.197:9100']
        labels:
          instance: pve01
      - targets: ['10.0.0.201:9100']
        labels:
          instance: k3s01
          parent: pve01
      - targets: ['10.0.0.202:9100']
        labels:
          instance: k3s02
          parent: pve01
      - targets: ['10.0.0.203:9100']
        labels:
          instance: k3s03
          parent: pve01

  # SMART for the Proxmox host's drives (docker#92, proxmox#42). 5 report today:
  # nvme0, sda (boston), sdb, sdd (external), sde (allston). sdc died in May.
  - job_name: smartctl
    scrape_interval: 60s
    static_configs:
      - targets: ['10.0.0.159:9633']
        labels:
          instance: proxmox
