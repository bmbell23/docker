global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: dockerhost

  # One target per machine. pve01 and k3s01 get added here once node_exporter
  # is installed on them (follow-up to #53).
  - job_name: node
    static_configs:
      - targets: ['dockerhost:9100']
        labels:
          instance: dockerhost
      # Proxmox host (docker#92, proxmox#42), by LAN IP like the Dagu ssh config.
      - targets: ['10.0.0.159:9100']
        labels:
          instance: proxmox

  # SMART for the Proxmox host's drives (docker#92, proxmox#42). 5 report today:
  # nvme0, sda (boston), sdb, sdd (external), sde (allston). sdc died in May.
  - job_name: smartctl
    scrape_interval: 60s
    static_configs:
      - targets: ['10.0.0.159:9633']
        labels:
          instance: proxmox
