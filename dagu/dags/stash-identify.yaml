name: stash-identify
description: Stash nightly identify pass
schedule: "0 3 * * *"
queue: heavy
max_active_runs: 1
steps:
  - name: identify
    command: ssh dockerhost '~/projects/docker/scripts/stash-identify.sh'
handler_on:
  failure:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh failed ${DAG_NAME} ${DAG_RUN_ID}"
  success:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh ok ${DAG_NAME} ${DAG_RUN_ID}"
