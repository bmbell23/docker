# Keeps the host's adb connected to Brandon's Fold so ws-scrcpy (the 📱 Phone tab,
# docker#171) has something to stream (docker#173). Wireless debugging moves port on every
# reboot or toggle; the script scans for the new one and reconnects, no pairing code.
# Idle poller: #dagu hears about it only when it reconnected. Red (one ping per outage)
# only after 3 failed runs in a row with the phone on the home LAN; the log says which
# tap fixes it.
name: phone-adb-reconnect
description: Reconnect adb to the Fold after its wireless-debugging port changes
schedule: "*/2 * * * *"
tags: [monitor]
max_active_runs: 1
steps:
  - name: reconnect
    command: ssh dockerhost '~/projects/docker/scripts/phone-adb-reconnect.sh'
handler_on:
  failure:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh failed ${DAG_NAME} ${DAG_RUN_ID}"
  success:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh ok ${DAG_NAME} ${DAG_RUN_ID} idle"
