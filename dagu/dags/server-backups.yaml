# The nightly backups. They all fired at 02:00 in cron, competing for the
# same disk; here they run in sequence so one finishes before the next starts.
# Immich is not here: it dumps its own database nightly into
# /mnt/boston/media/pictures/immich-storage/backups/.
name: server-backups
description: Databases (RomM, Jellyfin, Trilium) and GreatReads - nightly, in sequence
schedule: "0 2 * * *"
queue: heavy
max_active_runs: 1
steps:
  - name: databases
    command: ssh dockerhost '~/projects/docker/scripts/backup/backup-databases.sh'
    continue_on:
      failure: true
  - name: greatreads db
    command: ssh dockerhost '~/projects/GreatReads/greatreads/scripts/backup-db.sh'
    depends:
      - databases
