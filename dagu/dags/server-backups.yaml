# Nightly backups, in sequence. In cron these were three lines all firing at
# 02:00 against the same disk.
#
# The database step's cron line pointed at ~/projects/docker/backup-databases.sh,
# which was moved into scripts/backup/ at some point. Cron had been logging
# "not found" 251 times and the last real backup was 2026-01-19 -- eight months
# of nightly failures nobody saw, which is the whole argument for this move.
#
# Immich is deliberately NOT here: it writes its own nightly dumps to
# /mnt/boston/media/pictures/immich-storage/backups/ (current as of today). The
# old immich-daily-backup.sh cron pointed at a script that no longer exists and
# was redundant with that.
name: server-backups
description: Databases then GreatReads - nightly, in sequence
schedule: "0 2 * * *"
queue: heavy
max_active_runs: 1
steps:
  - name: databases
    command: ssh dockerhost '~/projects/docker/scripts/backup/backup-databases.sh'
    continue_on:
      failure: true
  - name: greatreads db
    command: ssh dockerhost '~/projects/GreatReads/greatreads/scripts/backup-db.sh'
    depends:
      - databases
handler_on:
  failure:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh failed ${DAG_NAME} ${DAG_RUN_ID}"
  success:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh ok ${DAG_NAME} ${DAG_RUN_ID}"
