# Every secret git doesn't hold (.env files, bots.json, tokens, ssh keys...), tarred in
# RAM and gpg-encrypted to a public key; the private key lives only in Vaultwarden
# (docker#84, agent-bus#145). bin/secrets-backup is Bianca's: it writes to
# /mnt/boston/documents/agentbus-backups/secrets, keeps 30 and skips unchanged nights.
# Runs as brandon over ssh, not as an agent, so it can read what agents can't.
# 00:45: after vaultwarden (00:15) and mattermost (00:30), before the 01:00 Proxmox rsync.
name: secrets-backup
description: Encrypted nightly backup of untracked secrets
schedule: "45 0 * * *"
tags: [backup]
max_active_runs: 1
steps:
  - name: backup secrets
    command: ssh dockerhost '~/projects/agent-bus/bin/secrets-backup'
handler_on:
  failure:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh failed ${DAG_NAME} ${DAG_RUN_ID}"
  success:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh ok ${DAG_NAME} ${DAG_RUN_ID}"
