# Publish audio<->ebook position maps for GreatReads. THIS WAS NEVER SCHEDULED:
# maps sat untouched from 2026-09-21 while 30 books were re-chaptered underneath
# them, and were only fresh because a human ran the command (MediaForge #23).
# Also re-verifies installed chapters so drift is caught rather than assumed.
name: mediaforge-publish-maps
description: Refresh sync maps + verify installed chapters against the audio
schedule: "17 4 * * *"
queue: heavy
max_active_runs: 1
steps:
  - name: verify installed chapters
    command: ssh dockerhost 'cd ~/projects/MediaForge && ./.venv/bin/python bin/audiobook verify --all'
    continue_on:
      failure: true
  - name: publish maps
    command: ssh dockerhost 'cd ~/projects/MediaForge && ./.venv/bin/python bin/audiobook sync-map --all'
    depends:
      - verify installed chapters

  # One status line per audiobook, for GreatReads' "chapters are wrong" badge
  # (GR #303). Runs last so it reflects this run's verification.
  - name: publish status
    command: ssh dockerhost 'cd ~/projects/MediaForge && ./.venv/bin/python bin/audiobook status'
    depends:
      - publish maps
handler_on:
  failure:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh failed ${DAG_NAME} ${DAG_RUN_ID}"
  success:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh ok ${DAG_NAME} ${DAG_RUN_ID}"
