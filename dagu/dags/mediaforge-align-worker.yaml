# Transcribe a parked audiobook with Whisper and place the ebook's chapters.
# 7-90 minutes of CPU per book; nice'd, ionice'd, memory-capped by the script
# itself, and it shares the chapter worker's lock so the two never overlap.
# Replaces: */20 * * * * ~/projects/MediaForge/bin/align-cron
name: mediaforge-align-worker
description: Chapters from the ebook's text, for books silence detection cannot do
schedule: "*/20 * * * *"
queue: heavy
max_active_runs: 1
steps:
  - name: align one book
    command: ssh dockerhost '~/projects/MediaForge/bin/align-cron'
handler_on:
  failure:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh failed ${DAG_NAME} ${DAG_RUN_ID}"
  success:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh ok ${DAG_NAME} ${DAG_RUN_ID} idle"
