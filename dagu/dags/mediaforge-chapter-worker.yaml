# Silence-detection chapter fixer, one book per tick. Skips itself when another
# worker holds the lock, when free RAM is under 2500 MB, or load15 is over 8.
# Replaces: */10 * * * * ~/projects/MediaForge/bin/worker-cron
name: mediaforge-chapter-worker
description: Fix one audiobook's chapters (silence detection)
schedule: "*/10 * * * *"
queue: heavy
max_active_runs: 1
steps:
  - name: fix one book
    command: ssh dockerhost '~/projects/MediaForge/bin/worker-cron'
handler_on:
  failure:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh failed ${DAG_NAME} ${DAG_RUN_ID}"
  success:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh ok ${DAG_NAME} ${DAG_RUN_ID} idle"
