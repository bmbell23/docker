# Notes autosync. Ran EVERY MINUTE in cron with no visibility; if it has been
# failing, nobody would know. Same cadence for now -- the point of moving it is
# that its failures become visible.
name: codeforge-notes-sync
description: CodeForge notes autosync
schedule: "* * * * *"
max_active_runs: 1
steps:
  - name: sync
    command: ssh dockerhost '~/projects/CodeForge/scripts/notes-autosync.sh'
