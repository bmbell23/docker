# Second copy of boston's Tier 1 data (documents + media/{audiobooks,books,games,
# music,pictures}, ~1.47 TB) onto the Allston USB drive, /mnt/allston/boston-copy
# (docker#12, #14; agent-bus thread 008; /mnt/boston/agent-comms/dakota-proxmox.md).
# Was: hourly backup-script.sh -> /mnt/backups, the SanDisk that died 2026-05-30.
# The script is streamed from this repo, so Proxmox needs no clone of it.
# Daily, not hourly: a full pass over USB takes hours. Not in the heavy queue:
# the work runs on Proxmox, not dockerhost.
name: proxmox-backup-rsync
description: Copy boston's Tier 1 data to /mnt/allston/boston-copy on Proxmox
tags: [backup]
schedule: "0 1 * * *"
max_active_runs: 1
steps:
  - name: rsync to allston
    command: sh -c "ssh proxmox 'bash -s' < /home/brandon/projects/docker/scripts/proxmox/boston-copy.sh"
handler_on:
  failure:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh failed ${DAG_NAME} ${DAG_RUN_ID}"
  success:
    command: ssh dockerhost "~/projects/docker/scripts/dagu-alert.sh ok ${DAG_NAME} ${DAG_RUN_ID}"
