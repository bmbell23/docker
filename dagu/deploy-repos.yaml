# Repos the reconciler keeps in step with origin/main (docker#45, agent-bus thread 016).
# Read every run by scripts/reconcile.sh; no restart needed after editing.
#
# For every enabled repo, whoever merged and however (ship-pr or the GitHub UI):
#   - version: main gets its vX.Y.Z commit + tag if the merge didn't bring one
#   - the main clone fast-forwards to origin/main (never stash, reset or discard)
#   - worktrees of merged PRs are removed, if clean and nothing unpushed
#   - deploy: runs the repo's own ./deploy when main moved. Having an executable
#     ./deploy at the repo root IS the opt-in (thread 016's contract): the owner adds
#     it in her repo, nothing here changes. `deploy: false` pauses it for one repo.
#
# Third-party stacks in docker/ stay manual: docker has no ./deploy.
#   - apk: runs the repo's own ./build-apk once the clone is at the new main and any
#     ./deploy ran; Biscuit announces it (docker#51, agent-bus thread 017). Same opt-in:
#     the executable file. `build_apk: false` pauses it. `apk: <script>` is the bridge:
#     the script to run while a repo has no ./build-apk yet; ./build-apk wins once it lands.
#   - win: then runs the repo's own ./build-windows, same contract and opt-in (docker#59).
#     `build_win: false` pauses it.
# `version: false` skips the version commit for a repo versioned some other way.
repos:
  - {name: Dashboard,  path: /home/brandon/projects/Dashboard,  enabled: true}
  - {name: docker,     path: /home/brandon/projects/docker,     enabled: true}
  - {name: agent-bus,  path: /home/brandon/projects/agent-bus,  enabled: true}
  - {name: ArtForge,   path: /home/brandon/projects/ArtForge,   enabled: true}
  - {name: Chess,      path: /home/brandon/projects/Chess,      enabled: true}
