  - {name: FunForge,   path: /home/brandon/projects/FunForge,   enabled: true, apk: build-apk.sh}
  - {name: GreatReads, path: /home/brandon/projects/GreatReads, enabled: true, apk: build-app.sh}
  - {name: Libby,      path: /home/brandon/projects/Libby,      enabled: true}
