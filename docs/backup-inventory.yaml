  - name: onedrive-isos
    source: /mnt/boston/OneDrive, /mnt/boston/isos
    priority: P3
    size: not measured
    primary:   {state: none}
    secondary: {state: none}
    offsite: none
    why: Tier 3 in the Phase 6 plan.

  - name: docker-db-dumps
    source: /mnt/boston/docker-backups
    priority: null
    size: 483M
    primary:   {dest: boston, method: dump, dag: server-backups, scheduler: dagu, schedule: "0 2 * * *", state: ok}
    secondary: {state: none}
    offsite: none
    why: >-
      RomM and Jellyfin DB dumps. This is itself the backup, and it sits on the same disk as
      the data. Not in the Allston source list.

  - name: wordforge
    source: ~/projects/WordForge/data/writing_platform.db (VM 101 root disk)
    priority: null
    size: 46K gzipped (2026-09-30)
    primary:   {dest: boston documents/wordforge-backups, method: dump, dag: wordforge-backup, scheduler: dagu, schedule: "35 2 * * *", state: ok, ref: "green 2026-10-02 02:35"}
    secondary: {dest: allston, method: rsync, dag: proxmox-backup-rsync, scheduler: dagu, schedule: "0 1 * * *", state: ok, ref: "rides in documents"}
    offsite: none
    why: >-
      Brandon's stories, one SQLite file. Before this only the weekly VM image held it. The
      dumps land inside documents/, so the next night's allston rsync (and pve01 restic, once
      live) carry them. Keeps 30, skips unchanged nights.

  - name: museforge-prompts
    source: ~/projects/MuseForge/prompts (VM 101 root disk, kept out of git on purpose)
    priority: null
    size: not measured
    primary:   {dest: boston documents/museforge-backups, method: tar, dag: museforge-backup, scheduler: dagu, schedule: "30 2 * * *", state: ok, ref: "green 2026-10-02 02:30"}
    secondary: {dest: allston, method: rsync, dag: proxmox-backup-rsync, scheduler: dagu, schedule: "0 1 * * *", state: ok, ref: "rides in documents"}
    offsite: none
    why: >-
      Brandon's private prompts, deliberately untracked (docker#10, MuseForge#17). Archives,
      verifies, skips unchanged, keeps 30. Lands in documents/, so pve01 restic and the
      external drive carry it too.

  - name: mattermost
    source: agentbus_postgres (Mattermost DB) + Mattermost attachments, ~/projects/agent-bus (VM 101 root disk)
    priority: null
    size: not measured
    primary:   {dest: boston documents/agentbus-backups, method: dump, dag: mattermost-backup, scheduler: dagu, schedule: "30 0 * * *", state: planned, ref: "docker#76, agent-bus#144"}
    secondary: {dest: allston, method: rsync, dag: proxmox-backup-rsync, scheduler: dagu, schedule: "0 1 * * *", state: planned, ref: "rides in documents"}
    offsite: none
    why: >-
      The office's chat history. Before this only the weekly VM image held it. pg_dump +
      attachments tar, keeps 30, skips unchanged; a one-time restore test compares post counts
      with prod (agent-bus#144). Lands in documents/, so allston and pve01 restic carry it.

  - name: agentbus-secrets
    source: every .env, bots.json and token file (sweep in agent-bus#145)
    priority: null
    size: not measured
    primary:   {dest: boston documents/agentbus-backups/secrets, method: tar, dag: secrets-backup, scheduler: dagu, schedule: "45 0 * * *", state: planned, ref: "docker#84, agent-bus#145; live after the one-time key setup"}
    secondary: {dest: allston, method: rsync, dag: proxmox-backup-rsync, scheduler: dagu, schedule: "0 1 * * *", state: planned, ref: "rides in documents"}
    offsite: none
    why: >-
      Encrypted archive; the key lives in Vaultwarden, so this is only restorable if Vaultwarden
      itself has a real backup (docker#83, vaultwarden entry below). gpg to a public key, so the server
      can write backups it can't read. Dagu runs it as brandon, which agents aren't.

  - name: vaultwarden
    source: ~/projects/docker/vaultwarden/data (VM 101 root disk)
    priority: null
    size: 328K archive (2026-10-02)
    primary:   {dest: boston documents/vaultwarden-backups, method: dump, dag: vaultwarden-backup, scheduler: dagu, schedule: "15 0 * * *", state: ok, ref: "docker#40; first run + restore test 2026-10-02 (integrity ok, 1 user, 619 items)"}
    secondary: {dest: allston, method: rsync, dag: proxmox-backup-rsync, scheduler: dagu, schedule: "0 1 * * *", state: ok, ref: "rides in documents; pve01 restic 03:00 too"}
    offsite: none
    why: >-
      Holds the passwords for every other backup, and the key to the agent-bus secrets archive
      (agent-bus#145). Uses vaultwarden's own `backup` (online-safe) + rsa_key.pem; keeps 30,
      skips unchanged. The weekly VM image still has a copy as well. boston is CIFS with
      file_mode 0775, so the archive isn't private on the share: vault items are client-side
      encrypted, but rsa_key.pem isn't.

  - name: docker-app-data
    source: each repo's ./data, /mnt/docker (VM 101 disks scsi0 104G + scsi1 200G)
    priority: null
    size: 304G image (99.2G archive)
    primary:   {dest: boston proxmox-backups, method: vzdump, dag: null, scheduler: proxmox, schedule: "Sun 21:00, keep 3", state: ok}
    secondary: {dest: pve01 fenway, method: pbs, dag: null, scheduler: manual, schedule: one run, state: planned, ref: "proxmox#34"}
    offsite: none
    why: >-
      Whole-VM image only, weekly (both disks verified in the 2026-09-27 vzdump log). Per-app
      coverage is docker#40.

  - name: vm-101-dumps
    source: /mnt/boston/proxmox-backups
    priority: null
    size: 294G
    primary:   {dest: boston, method: vzdump, dag: null, scheduler: proxmox, schedule: "Sun 21:00, keep 3", state: ok}
    secondary: {dest: pve01 fenway, method: pbs, dag: null, scheduler: manual, schedule: one run, state: planned, ref: "proxmox#34"}
    offsite: none
    why: >-
      Not in Dagu on purpose: Dagu runs inside VM 101. Same disk as the data. Fenway is empty
      (259M used) and proxmox has no fenway-pbs storage yet. A recurring PBS copy needs a
      second jobs.cfg entry (Paul). PBS prunes (keep-last 3), GCs and verifies on its own scheduler.

  - name: proxmox-config
    source: /mnt/boston/proxmox-config-backups
    priority: null
    size: 32G
    primary:   {dest: boston, method: tar, dag: proxmox-config-backup, scheduler: dagu, schedule: "0 2 * * *", state: partial}
    secondary: {dest: boston proxmox-config-backups-homelab, method: tar, dag: proxmox-config-backup-homelab, scheduler: dagu, schedule: "10 2 * * *", state: shadow, ref: "docker#21 shadow run on the same disk; replaces primary once signed off"}
    offsite: none
    why: >-
      Runs as brandon, so no /etc/pve/priv. Last complete archive 2026-09-29 13:29 (root run),
      kept as newest complete. It holds the cluster CA key on guest-writable boston (proxmox#6);
      move to a root-only /opt/homelab path pending (Paul). The 32G is old 09-02..09-24
      archives, pruning out by late October.

  - name: dockerhost-etc
    source: /etc (dockerhost)
    priority: null
    size: small
    primary:   {dest: /etc/.git, method: git, dag: null, scheduler: builtin, schedule: etckeeper, state: ok}
    secondary: {dest: boston proxmox-backups, method: vzdump, dag: null, scheduler: proxmox, schedule: "Sun 21:00", state: ok}
    offsite: none
    why: Whether etckeeper pushes anywhere is unverified (root-only); assume local only.

  - name: proxmox-host-os
    source: proxmox host
    priority: null
    size: null
    primary:   {dest: /etc/.git, method: git, dag: null, scheduler: builtin, schedule: etckeeper.timer, state: partial}
    secondary: {state: none}
    offsite: none
    why: >-
      Not backed up, by choice: reinstall plus the config archive. Its etckeeper repo is
      local; a push anywhere is unverified (root-only).

  - name: pve01-legacy-data
    source: pve01 /mnt/beacon (18.1G), /mnt/brighton (25.4G)
    priority: null
    size: 43.5G
    primary:   {state: none}
    secondary: {state: none}
    offsite: none
    why: Pre-plan data, uncatalogued. Peter inventories it once his restic verb works.

drives:
  - name: external
    path: /mnt/external (proxmox, WD Passport 2 TB); /mnt/remote/external on pve01
    state: active
    dag: proxmox-external-sync
    holds: >-
      Third copy of documents and pictures (minus Immich's regenerable encoded-video/ and
      thumbs/), nightly at 04:00 (docker#16). Used/free is the last line of each run's log.
      Not offsite: it lives in the same house.
    note: On pve01 it's mounted read-write without nofail (boston is ro,nofail); fstab fix is Brandon's.

offsite: none  # parked by Brandon's call; no copy of anything survives the house
