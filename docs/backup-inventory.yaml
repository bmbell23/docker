  - name: media-other
    source: /mnt/boston/media/other
    priority: P3
    size: 517M
    primary:   {state: none}
    secondary: {state: none}
    offsite: none
    why: Not in the Allston source list.

  - name: photos
    source: /mnt/boston/media/pictures/library/photos
    priority: P0
    size: 560G
    primary:   {dest: allston, method: rsync, dag: proxmox-backup-rsync, scheduler: dagu, schedule: "0 1 * * *", state: ok}
    secondary: {dest: pve01 brighton, method: rsync, dag: pve01-pictures-copy, scheduler: dagu, schedule: "30 3 * * *", state: ok, ref: "first full copy 2026-10-01 23:36 (rsync exit 0, 1.16 TB); scheduled run green 2026-10-02 03:34"}
    tertiary:  {dest: external, method: rsync, dag: proxmox-external-sync, scheduler: dagu, schedule: "0 4 * * *", state: ok, ref: "docker#16; green 2026-10-02 04:00"}
    offsite: none
    why: >-
      Brighton runs rsync without --delete: a photo deleted on boston survives there, an
      edited one is overwritten (no versions). External: same, no --delete.

  - name: images
    source: /mnt/boston/media/pictures/library/images
    priority: P3
    size: 80G
    primary:   {dest: allston, method: rsync, dag: proxmox-backup-rsync, scheduler: dagu, schedule: "0 1 * * *", state: ok}
    secondary: {dest: pve01 brighton, method: rsync, dag: pve01-pictures-copy, scheduler: dagu, schedule: "30 3 * * *", state: ok, ref: "first full copy 2026-10-01 23:36 (rsync exit 0, 1.16 TB); scheduled run green 2026-10-02 03:34"}
    tertiary:  {dest: external, method: rsync, dag: proxmox-external-sync, scheduler: dagu, schedule: "0 4 * * *", state: ok, ref: "docker#16; green 2026-10-02 04:00"}
    offsite: none
    why: Rides along with pictures/. Same as photos.

  - name: home-videos
    source: /mnt/boston/media/videos/home
    priority: P0
    size: 1.7G
