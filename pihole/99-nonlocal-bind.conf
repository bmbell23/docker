# Lets Pi-hole's 100.69.184.113:53 bind succeed at boot before tailscale0 has that IP (docker#166).
# Without it, Docker starting first fails the bind, and with it the whole pihole container (LAN DNS too).
# Install: sudo install -m 644 pihole/99-nonlocal-bind.conf /etc/sysctl.d/ && sudo sysctl --system
net.ipv4.ip_nonlocal_bind = 1
