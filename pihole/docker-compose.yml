name: pihole

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      # Cloudflare Family (malware + adult filtering) as upstream — second
      # layer of adult-content blocking behind the local blocklists
      FTLCONF_dns_upstreams: 1.1.1.3;1.0.0.3
      # Answer queries from any interface (LAN traffic arrives via the
      # Docker bridge, which "local" mode would refuse)
      FTLCONF_dns_listeningMode: all
      # Local DNS records: without these no .home name resolves anywhere on
      # the LAN. Short and FQDN forms both answer.
      FTLCONF_dns_hosts: "10.0.0.160 dockerhost dockerhost.home;10.0.0.159 proxmox proxmox.home"
    ports:
      # DNS on specific IPs, not 0.0.0.0 — systemd-resolved holds the
      # 127.0.0.53:53 stub, which blocks a wildcard bind
      - "10.0.0.160:53:53/tcp"      # LAN
      - "10.0.0.160:53:53/udp"
      # TEMP disabled: Tailscale logged out (NeedsLogin), IP not assigned so bind fails.
      # Re-enable after: sudo tailscale up
      # - "100.69.184.113:53:53/tcp"  # Tailscale
      # - "100.69.184.113:53:53/udp"
      - "127.0.0.1:53:53/tcp"       # local testing from the server
      - "127.0.0.1:53:53/udp"
      - "${PIHOLE_WEB_PORT}:80"
    volumes:
      - ./data:/etc/pihole
      - /etc/localtime:/etc/localtime:ro

    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"
