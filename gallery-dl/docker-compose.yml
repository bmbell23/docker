name: gallery-dl

services:
  gallery-dl:
    container_name: gallery-dl
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # Adult content destination
      - /mnt/boston/media/other/Pictures:/pictures
      # Non-adult images destination
      - /mnt/boston/media/pictures/library/images:/library-images
      # User config dir (cookies, per-site overrides, custom config files)
      - ${CONFIG_LOCATION}:/root/.config/gallery-dl
      # Default config (logging, archive db, rate limits) - overlays the dir mount above
      - ./config.json:/root/.config/gallery-dl/config.json:ro
      # Persistent logs + download-archive db
      - ./logs:/var/log/gallery-dl

    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 64M
