# yt-dlp system-wide configuration
# Mounted into container at /etc/yt-dlp.conf

# Use Node.js for YouTube JS challenge solving
--js-runtimes node

# Allow fetching updated challenge solver scripts from GitHub
--remote-components ejs:github

# PO tokens from the bgutil provider sidecar (docker#179). Without one, YouTube answers
# "Sign in to confirm you're not a bot" for every video, cookies or not.
--extractor-args "youtubepot-bgutilhttp:base_url=http://bgutil-provider:4416"
