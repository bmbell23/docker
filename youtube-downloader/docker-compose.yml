name: youtube-downloader

services:
  yt-dlp-web:
    container_name: yt-dlp-web
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-dlp-web:local
    restart: unless-stopped
    ports:
      - "8998:3033"
    # Override image ENTRYPOINT to enable file logging (-fl) to a host-mounted path.
    # entrypoint: [] is required because the image's ENTRYPOINT already invokes the
    # binary; without clearing it, `command:` would be appended as extra args and
    # Go's flag parser would silently drop our `-fl -lf` flags.
    entrypoint: ["./yt-dlp-webui"]
    command:
      - --out
      - /downloads
      - --conf
      - /config/config.yml
      - --db
      - /config/local.db
      - -fl
      - -lf
      - /config/yt-dlp-webui.log
    environment:
      # Download settings
      DOWNLOAD_PATH: /downloads

      # Authentication
      USERNAME: ${YT_DLP_USERNAME}
      PASSWORD: ${YT_DLP_PASSWORD}

    volumes:
      # Downloads go here
      - ${DOWNLOAD_LOCATION}:/downloads
      # Persistent state: SQLite DB + file log live here (binary writes to /config)
      - ${DATA_LOCATION}:/config
      # Config file for default settings (overlays the bind mount above)
      - ./config.yml:/config/config.yml:ro
      # Stash video library for direct downloads
      - /mnt/boston/media/other/Videos/Full:/stash-videos
      # Short-form adult content (RedGIFs, clips, etc.)
      - /mnt/boston/media/other/Videos/Short:/stash-shorts
      # Non-adult video library
      - /mnt/boston/media/videos:/media-videos
      # Kids video library
      - /mnt/boston/media/kid-media/Videos:/kid-videos
      # Music / audio-only downloads
      - /mnt/boston/media/music:/music
      # Kids podcasts
      - /mnt/boston/media/kid-media/Podcasts:/kid-podcasts
      # YouTube cookies for age-restricted downloads (export from browser via cookies.txt extension)
      # Writable: yt-dlp saves rotated cookies back on every run (ro mount breaks all downloads)
      - ./cookies.txt:/cookies/youtube.txt
      # yt-dlp system config (JS runtime, remote components)
      - ./yt-dlp.conf:/etc/yt-dlp.conf:ro

    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

