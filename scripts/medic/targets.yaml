# The medic's allowlist (docker#143, agent-bus docs/SELF-HEAL.md Tier 0).
# An alert carrying `remedy: <playbook>` is looked up here by its `remedy_key` label,
# or its `key` label (the Dashboard card key) when it has none. No entry = the medic
# touches nothing and forwards the alert to Mongo at once.
# Read on every alert: no restart needed after editing.
#
# recreate:  <key>: {repo: <name in dagu/deploy-repos.yaml>, dir: <compose dir in it>, service: <svc>}
# user-unit: <key>: {unit: <systemd --user unit>}
# dnat:      <key>: {port: <host port>}   (via the sudo wrapper scripts/medic/medic-dnat)
# dagu-run:  <key>: {dag: <name in dagu/dags>}   (1 try; skipped, and paged, if suspended or running)
#
# Never here (medic.py refuses them anyway): Mattermost, Postgres, databases, and the
# monitoring stack the medic itself depends on.

recreate:
  jellyfin:       {repo: docker, dir: jellyfin,       service: jellyfin}
  audiobookshelf: {repo: docker, dir: audiobookshelf, service: audiobookshelf}
  romm:           {repo: docker, dir: romm,           service: romm}      # the app only; never romm-db
  jackett:        {repo: docker, dir: jackett,        service: jackett}   # rejoins mullvad-vpn's network (4 Oct 2026)
  deemix:         {repo: docker, dir: deemix,         service: deemix}
  stash:          {repo: docker, dir: stash,          service: stash}
  calibre:        {repo: docker, dir: calibre,        service: calibre}
  trilium:        {repo: docker, dir: trilium,        service: trilium}

  # The agents' own apps (docker#160). Rusty posts in #infra; if he gives up, Mongo pages the card's owner as before.
  artforge:         {repo: ArtForge,  dir: ., service: artforge}
  wordforge:        {repo: WordForge, dir: ., service: wordforge}
  lifeforge:        {repo: LifeForge, dir: ., service: lifeforge}
  booknews:         {repo: NerdNews,  dir: ., service: booknews}           # NerdNews' card key is booknews
  funforge:         {repo: FunForge,  dir: ., service: funforge}
  mealforge:        {repo: MealForge, dir: ., service: mealforge}
  museforge-studio: {repo: MuseForge, dir: ., service: studio}
  webforge:         {repo: WebForge,  dir: ., service: webforge_releases}  # the :8012 card; never webforge_sync/macmirror
  libby-web:        {repo: Libby,     dir: ., service: libby-web}          # never libby-web-test

  # Deliberately not here: greatreads-prod (a --user unit, see user-unit), office (Mattermost), immich (Postgres/Redis
  # stack), vaultwarden and pihole (want a human), chess/dictionary/pokevault (run on k3s), the monitoring stack and dagu.

# docker#161. Never agent-bus-router: a restart kills every agent turn in flight.
user-unit:
  greatreads-prod: {unit: greatreads-web.service}   # GreatReads :8090 runs as a --user unit, not a container

# Ports where a stale DNAT rule has actually bitten us (CLAUDE.md gotcha): works on 127.0.0.1,
# times out on the Tailscale IP. Run after recreate (`recreate+dnat`), or alone. Needs medic-dnat
# installed as root (its header); until then this step fails and the alert pages as before.
dnat:
  jellyfin: {port: 8096}   # docs/docker/DOCKER_IPTABLES_FIX.md
  immich:   {port: 2283}   # same doc; immich itself isn't recreated (Postgres/Redis stack)
  jackett:  {port: 9117}   # VPN-TORRENT-SETUP.md: published by mullvad-vpn, which jackett shares

# BackupStale (rules/host.yml), keyed by its `repo` label (docker#159). A restic run only adds data,
# and the DAG's max_active_runs: 1 stops overlaps. Suspended = pve01 maintenance: hands off.
dagu-run:
  documents: {dag: pve01-documents-restic}
